name: Build certified Build properties

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-certified-props
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Build and sign checked-in properties
        env:
          PLATFORM_KEY: ${{ secrets.CERTIFIED_PROPS_PLATFORM_KEY }}
          PLATFORM_CERT: ${{ secrets.CERTIFIED_PROPS_PLATFORM_CERT }}
        run: |
          set -euo pipefail
          test -n "$PLATFORM_KEY"
          test -n "$PLATFORM_CERT"
          keydir=$(mktemp -d "$RUNNER_TEMP/props-signing.XXXXXX")
          trap 'rm -rf "$keydir"' EXIT
          umask 077
          printf '%s' "$PLATFORM_KEY" | base64 --decode > "$keydir/platform.pk8"
          printf '%s' "$PLATFORM_CERT" | base64 --decode > "$keydir/platform.x509.pem"
          export CERTIFIED_PROPS_KEY="$keydir/platform"
          bash scripts/build-certified-props.sh
      - name: Commit rebuilt APK
        run: |
          if git diff --quiet -- certified_build_props.apk; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add certified_build_props.apk
          git commit -m 'chore: rebuild certified properties APK'
          git push
